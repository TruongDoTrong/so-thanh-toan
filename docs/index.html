<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sổ thanh toán">
<meta name="theme-color" content="#0c6a7a">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}[hidden]{display:none!important}</style>
<title>Sổ thanh toán công trình</title>
<style>
/* Font: CHI dung font co san cua may (iPhone/iPad: San Francisco, Android: Roboto, Windows: Segoe UI) - du dau
   tieng Viet. Font tai tu Google Fonts bi loi dau tren dien thoai (nguoi dung bao 19/10/2026). */
/* Bố cục: một cột hẹp như sổ tay — dải hồ sơ ở trên, thẻ chuyển trang dính phía trên, mỗi trang là danh sách dòng tiền */
:root {
  --nen: #f3f5f4;
  --mat: #ffffff;
  --muc: #1b2a30;
  --phu: #5b6b70;
  --vien: #dde3e2;
  --nhan: #0c6a7a;
  --nhan-nhat: #e1f0f1;
  --da-tra: #2c7a4b;
  --canh-bao: #a35a12;
  --canh-bao-nen: #fbefdf;
  --loi: #b3261e;
  --loi-nen: #fbe7e5;
  --thanh: #e6ebea;
  --ps-khach: #e3f4e6;
  --ps-noibo: #fbf3d2;
  --ps-nhathau: #e2ecfa;
  --dn: #c2410c;
  --dn-nen: #ffedd5;
  --chu-chinh: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --chu-tieu-de: var(--chu-chinh);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --nen: #111a1d; --mat: #182327; --muc: #e4ecec; --phu: #93a5a8; --vien: #2a393d;
    --nhan: #5cc3d1; --nhan-nhat: #173a40; --da-tra: #6fcf97; --canh-bao: #f0b26b; --canh-bao-nen: #3a2a17;
    --loi: #f2948b; --loi-nen: #3d1d1a; --thanh: #26353a; color-scheme: dark;
    --ps-khach: #1d3524; --ps-noibo: #3a3418; --ps-nhathau: #1c2c42;
    --dn: #fdba74; --dn-nen: #3b2414;
  }
}
:root[data-theme="dark"] {
  --nen: #111a1d; --mat: #182327; --muc: #e4ecec; --phu: #93a5a8; --vien: #2a393d;
  --nhan: #5cc3d1; --nhan-nhat: #173a40; --da-tra: #6fcf97; --canh-bao: #f0b26b; --canh-bao-nen: #3a2a17;
  --loi: #f2948b; --loi-nen: #3d1d1a; --thanh: #26353a; color-scheme: dark;
  --ps-khach: #1d3524; --ps-noibo: #3a3418; --ps-nhathau: #1c2c42;
  --dn: #fdba74; --dn-nen: #3b2414;
}
* { box-sizing: border-box; }
body {
  background: var(--nen); color: var(--muc); font-family: var(--chu-chinh); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 40px;
}
.khung { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.khung > .tom { max-width: 640px; }

/* Bảng y như máy tính: cuộn ngang/dọc trong khung, dòng tiêu đề và cột đầu đứng yên */
.cuon { overflow: auto; max-height: 72vh; background: var(--mat); border: 1px solid var(--vien); border-radius: 12px; -webkit-overflow-scrolling: touch; }
table.bang { border-collapse: separate; border-spacing: 0; font-size: .84rem; font-variant-numeric: tabular-nums; min-width: 100%; }
table.bang th, table.bang td { padding: 7px 10px; border-bottom: 1px solid var(--vien); text-align: left; vertical-align: top; background: var(--mat); }
table.bang th { position: sticky; top: 0; z-index: 2; background: var(--thanh); font-weight: 600; white-space: nowrap; font-size: .78rem; color: var(--phu); }
table.bang th:first-child, table.bang td:first-child { position: sticky; left: 0; z-index: 1; box-shadow: 1px 0 0 var(--vien); }
table.bang th:first-child { z-index: 3; }
table.bang td.e, table.bang th.e { text-align: right; white-space: nowrap; }
table.bang td.c, table.bang th.c { text-align: center; white-space: nowrap; }
table.bang td.w { min-width: 90px; max-width: 340px; }
table.bang td.w.dai { min-width: 200px; }
table.bang tr.tong td { background: var(--nhan-nhat); font-weight: 700; }
table.bang tr.cong td { background: var(--nhan-nhat); font-weight: 700; }
table.bang tr.dot_nay td { background: var(--dn-nen); color: var(--dn); font-weight: 700; }
table.bang tr.am td { color: var(--loi); }
table.bang tr.mo td { color: var(--phu); }
table.bang tr.thieu td { background: var(--canh-bao-nen); color: var(--canh-bao); }
table.bang tr.bo td { background: var(--nhan-nhat); font-weight: 600; }
table.bang tr.ps_khach td { background: var(--ps-khach); }
table.bang tr.ps_noibo td { background: var(--ps-noibo); }
table.bang tr.ps_nhathau td { background: var(--ps-nhathau); }
table.bang tr.bam { cursor: pointer; }
table.bang tr.bam td:first-child { color: var(--nhan); font-weight: 600; }
table.bang tr.bam td:first-child::after { content: " ›"; }
table.bang tr.bam:hover td, table.bang tr.bam:focus-visible td { background: var(--nhan-nhat); }
table.bang tr.bam:focus-visible { outline: 2px solid var(--nhan); outline-offset: -2px; }
.thanh-cong-cu { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.o-loc { font: inherit; font-size: .9rem; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--vien); background: var(--mat); color: var(--muc); flex: 1 1 200px; min-width: 0; }
.o-loc:focus-visible { outline: 3px solid var(--nhan); outline-offset: 1px; }
.ghi-chu { white-space: pre-wrap; font-size: .84rem; color: var(--phu); background: var(--mat); border: 1px solid var(--vien); border-radius: 12px; padding: 10px 12px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { font: inherit; font-size: .8rem; font-weight: 600; border: 1px solid var(--vien); background: var(--mat); color: var(--phu); border-radius: 8px; padding: 6px 10px; cursor: pointer; text-align: left; }
.chips button[aria-pressed="true"] { border-color: var(--nhan); color: var(--nhan); background: var(--nhan-nhat); }
.quay-lai { align-self: flex-start; }
.bao-dot-nay { background: var(--dn-nen); color: var(--dn); font-weight: 700; border-radius: 10px; padding: 8px 12px; font-size: .9rem; }
.dot-nay { display: block; color: var(--dn); font-weight: 700; font-size: .76rem; white-space: nowrap; }
table.bang td.co-dot-nay { background: var(--dn-nen); }
table.bang tr.hang-dot-nay td:first-child { box-shadow: inset 5px 0 0 var(--dn), 1px 0 0 var(--vien); color: var(--dn); }
.cap.dong-dot-nay { background: var(--dn-nen); border-radius: 8px; padding: 4px 8px; margin: 2px -8px; }
.cap.dong-dot-nay > span { color: var(--dn) !important; font-weight: 700; }
@media (prefers-reduced-motion: no-preference) {
  .nhay, table.bang tr.dot_nay td { animation: nhay 1.1s ease-in-out infinite; }
  @keyframes nhay { 50% { opacity: .3; } }
}
.cac-tong { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.mot-tong { padding: 12px 14px; gap: 4px; }
.mot-tong .ten-tong { font-weight: 700; font-size: .9rem; overflow-wrap: anywhere; }
.mot-tong .cap { font-size: .86rem; }
@media (max-width: 600px) {
  table.bang td:first-child, table.bang td:first-child.dai { min-width: 110px; max-width: 42vw; }
  table.bang td.w.dai { min-width: 170px; }
}
.so { font-variant-numeric: tabular-nums; white-space: nowrap; }
h1, h2, h3 { font-family: var(--chu-tieu-de); font-weight: 600; text-wrap: balance; margin: 0; }
h1 { font-size: 1.15rem; }
h2 { font-size: 1.02rem; }
.dau { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.nho { font-size: .82rem; color: var(--phu); }
.nut {
  font: inherit; font-weight: 600; font-size: .9rem; border-radius: 10px; padding: 9px 14px; cursor: pointer;
  border: 1px solid var(--nhan); background: var(--nhan); color: var(--mat);
  display: inline-flex; align-items: center; gap: 6px;
}
.nut.phu { background: transparent; color: var(--nhan); }
.nut:focus-visible, .the:focus-visible, .chon button:focus-visible { outline: 3px solid var(--nhan); outline-offset: 2px; }
#o-file { position: absolute; width: 1px; height: 1px; opacity: 0; }

.ho-so { background: var(--mat); border: 1px solid var(--vien); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.ho-so .ten-ct { font-family: var(--chu-tieu-de); font-size: 1.05rem; font-weight: 600; }
.nhan-trang-thai { display: inline-block; font-size: .74rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; }
.tt-da { background: var(--nhan-nhat); color: var(--da-tra); }
.tt-xin { background: var(--canh-bao-nen); color: var(--canh-bao); }
.tt-vd { background: var(--thanh); color: var(--phu); }
.bao { border-radius: 12px; padding: 10px 12px; font-size: .9rem; }
.bao.loi { background: var(--loi-nen); color: var(--loi); }
.bao.vang { background: var(--canh-bao-nen); color: var(--canh-bao); }

.cac-the {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--nen);
  display: flex; gap: 4px; overflow-x: auto; padding-block: 6px; scrollbar-width: none;
}
.cac-the::-webkit-scrollbar { display: none; }
.the {
  font: inherit; font-size: .88rem; font-weight: 600; white-space: nowrap; cursor: pointer;
  border: 1px solid var(--vien); background: var(--mat); color: var(--phu); border-radius: 999px; padding: 7px 13px;
}
.the[aria-selected="true"] { background: var(--muc); border-color: var(--muc); color: var(--nen); }

.trang { display: flex; flex-direction: column; gap: 12px; }
.tong { background: var(--mat); border: 1px solid var(--vien); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.so-lon { font-family: var(--chu-tieu-de); font-size: 1.7rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.15; }
.so-lon small { font-size: .9rem; font-weight: 500; color: var(--phu); }
.cap { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.cap > span:first-child { min-width: 0; color: var(--phu); }
.cap.dam > span { color: var(--muc); font-weight: 700; }
.cap.ke { border-top: 1px dashed var(--vien); padding-top: 6px; }
.am { color: var(--loi) !important; }

.ds { background: var(--mat); border: 1px solid var(--vien); border-radius: 14px; overflow: hidden; }
.dong { padding: 12px 14px; border-top: 1px solid var(--vien); display: flex; flex-direction: column; gap: 5px; }
.dong:first-child { border-top: 0; }
.dong .ten { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.dong.nhom { background: var(--nhan-nhat); }
.dong.du-thao { box-shadow: inset 4px 0 0 var(--canh-bao); }
.thanh { height: 6px; background: var(--thanh); border-radius: 99px; overflow: hidden; }
.thanh > i { display: block; height: 100%; background: var(--da-tra); border-radius: 99px; }
.luoi { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 10px; font-size: .85rem; }
.luoi div { min-width: 0; }
.luoi b { display: block; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.luoi span { color: var(--phu); font-size: .75rem; }
.chip { font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--canh-bao-nen); color: var(--canh-bao); white-space: nowrap; }
.chon { display: inline-flex; background: var(--thanh); border-radius: 10px; padding: 3px; gap: 3px; }
.chon button { font: inherit; font-size: .85rem; font-weight: 600; border: 0; background: transparent; color: var(--phu); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.chon button[aria-pressed="true"] { background: var(--mat); color: var(--muc); }
.chu-thich { font-size: .8rem; color: var(--phu); }
.trong { text-align: center; padding: 22px 14px; color: var(--phu); }
@media (prefers-reduced-motion: no-preference) { .thanh > i { transition: width .4s ease; } }
@media (max-width: 380px) { .luoi { grid-template-columns: repeat(2, minmax(0, 1fr)); } .so-lon { font-size: 1.45rem; } }
</style>
</head>
<body>
<div class="khung">
  <header class="dau">
    <div>
      <h1>Sổ thanh toán công trình</h1>
      <div class="nho">Xem đầy đủ hồ sơ zip thanh toán trên điện thoại / iPad · chỉ xem, không sửa</div>
    </div>
    <label class="nut" for="o-file">📂 Mở file zip</label>
    <!-- KHONG dat accept: Android (file tai tu Zalo / email) hay bao file zip la loai "khong ro" nen bi lam mo,
         khong chon duoc (nguoi dung bao 21/10/2026). Kiem dung ho so zip sau khi doc. -->
    <input id="o-file" type="file">
  </header>

  <div id="bao"></div>
  <section id="ho-so" class="ho-so" aria-live="polite"></section>
  <nav class="cac-the" id="cac-the" role="tablist" aria-label="Các phần"></nav>
  <main id="noi-dung" class="trang"></main>
  <p class="chu-thich">File zip được đọc ngay trên điện thoại này, không gửi đi đâu. Số trên trang là số chương trình
    trên máy tính đã tính lúc xuất hồ sơ.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function () {
  "use strict";
  var KHOA_NHO = "so-tt-ho-so-gan-nhat";
  var fmt = new Intl.NumberFormat("vi-VN", { maximumFractionDigits: 0 });
  var fmtKl = new Intl.NumberFormat("vi-VN", { maximumFractionDigits: 3 });
  function tien(v) { return v == null || v === "" ? "—" : fmt.format(Math.round(Number(v))); }
  function kl(v) { return v == null ? "—" : fmtKl.format(Number(v)); }
  function gon(v) {
    v = Number(v) || 0; var a = Math.abs(v);
    if (a >= 1e9) return (v / 1e9).toLocaleString("vi-VN", { maximumFractionDigits: 2 }) + " tỷ";
    if (a >= 1e6) return (v / 1e6).toLocaleString("vi-VN", { maximumFractionDigits: 1 }) + " tr";
    return fmt.format(Math.round(v));
  }
  function phanTram(a, b) { return b ? Math.max(0, Math.min(100, a / b * 100)) : 0; }
  function pt(a, b) { return b ? (a / b * 100).toLocaleString("vi-VN", { maximumFractionDigits: 1 }) + "%" : ""; }
  function e(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function cap(nhan, giaTri, lop) { return '<div class="cap ' + (lop || "") + '"><span>' + e(nhan) + '</span><span class="so">' + giaTri + "</span></div>"; }
  function thanh(a, b) { return '<div class="thanh" aria-hidden="true"><i style="width:' + phanTram(a, b).toFixed(1) + '%"></i></div>'; }
  function o(nhan, giaTri, lop) { return '<div><span>' + e(nhan) + '</span><b class="' + (lop || "") + '">' + giaTri + "</b></div>"; }

  // Làm tròn như Excel (0,5 lên) — chỉ dùng cho hồ sơ cũ chưa có mobile.json
  function lamTron(x) { return x < 0 ? -Math.round(-x) : Math.round(x); }
  function tienBaPhan(k, a, b, c) { return lamTron(k * a) + lamTron(k * b) + lamTron(k * c); }

  var duLieu = null, laViDu = false, theDang = "ky", kieuTh = "goi";

  var CAC_THE = [["ky", "Kỳ này"], ["1", "1 · Số liệu"], ["2", "2 · Chủ đầu tư"], ["3", "3 · Giá vốn"],
    ["4", "4 · Điều chỉnh"], ["5", "5 · Thanh toán"], ["6", "6 · Tổng hợp"], ["nk", "Nhật ký"]];
  var $ = function (id) { return document.getElementById(id); };

  function bao(chu, lop) { $("bao").innerHTML = chu ? '<div class="bao ' + (lop || "loi") + '">' + chu + "</div>" : ""; }

  function veHoSo() {
    var k = duLieu.ky_nay || {};
    var nhan = laViDu ? '<span class="nhan-trang-thai tt-vd">Số liệu ví dụ</span>'
      : k.da_ghi_nhan === false ? '<span class="nhan-trang-thai tt-xin">Xin thanh toán · chưa trả</span>'
      : '<span class="nhan-trang-thai tt-da">Đã thanh toán</span>';
    var dot = k.dot != null ? String(k.dot).padStart(2, "0") : "";
    $("ho-so").innerHTML =
      '<div class="dau"><span class="ten-ct">' + e(duLieu.cong_trinh || "(không rõ công trình)") + "</span>" + nhan + "</div>" +
      '<div class="nho">Hồ sơ gói <b>' + e(k.goi || "") + "</b> · đợt " + dot + (k.ngay ? " ngày " + e(k.ngay) : "") +
      (k.tao_luc ? " · lập lúc " + e(k.tao_luc) : "") + "</div>" +
      (laViDu ? '<div class="nho">Chưa mở hồ sơ nào. Bấm “Mở file zip” và chọn file zip thanh toán nhận qua Zalo / email (lưu vào Tệp / File trước).</div>' : "") +
      '<div><button class="nut phu" id="quen" type="button">✕ Đóng hồ sơ</button></div>';
    var q = $("quen");
    if (q) q.onclick = function () { batDau(); };
  }

  function veThe() {
    $("cac-the").innerHTML = CAC_THE.map(function (t) {
      return '<button class="the" role="tab" type="button" id="the-' + t[0] + '" aria-selected="' + (t[0] === theDang) + '">' + t[1] + "</button>";
    }).join("");
    CAC_THE.forEach(function (t) { $("the-" + t[0]).onclick = function () { theDang = t[0]; chiTiet = []; loc = ""; veThe(); veTrang(); }; });
  }

  function chuaCo(ten) { return '<div class="ds"><div class="trong">Hồ sơ này lập bằng bản chương trình cũ nên chưa có phần “' + ten + '”. Lập lại hồ sơ bằng bản mới để xem.</div></div>'; }

  function trangKyNay() {
    var k = duLieu.ky_nay;
    if (!k) return chuaCo("Kỳ này");
    var lkSt = k.tong_luy_ke_sau_thue != null ? k.tong_luy_ke_sau_thue : k.tong_luy_ke;
    var h = '<div class="tong">' +
      '<div class="nho">' + (k.da_ghi_nhan === false ? "Xin thanh toán kỳ này" : "Thanh toán kỳ này") + "</div>" +
      '<div class="so-lon">' + tien(k.lan_nay) + " <small>đ</small></div>" +
      cap("Giá trị gói (giá vốn, trước thuế)", tien(k.gia_tri_hop_dong)) +
      cap("Lũy kế khối lượng, trước thuế", tien(k.tong_luy_ke)) +
      (k.thue_suat != null ? cap("Lũy kế sau thuế (VAT " + kl(k.thue_suat) + "%)", tien(lkSt)) : "");
    // Nguoi dung chot 20/10/2026: tam ung = thanh toan dot 1, khong con tam ung rieng -> dong "Tam ung" chi hien
    // khi so lieu cu co tien tam ung (nhu khung Tong hop goi thau tren may tinh)
    var cacDong = [];
    if (Math.abs(Number(k.tam_ung) || 0) > 0.5) cacDong.push(["Tạm ứng", k.tam_ung]);
    (k.cac_ky_da_tra || []).forEach(function (x) { cacDong.push(["Đã trả kỳ " + x.ky + (x.ngay ? " (" + x.ngay + ")" : ""), x.so_tien]); });
    cacDong.push(["Kỳ này", k.lan_nay]);
    cacDong.forEach(function (r, i) { h += cap(r[0], tien(r[1]), i === 0 ? "ke" : ""); });
    h +=
      cap("Chưa thanh toán", tien(k.chua_thanh_toan), "dam ke" + (k.chua_thanh_toan < -0.5 ? " am" : "")) + "</div>";
    if (k.goi_bo) {
      var b = k.goi_bo;
      h += "<h2>Gói bố “" + e(b.cha) + "”</h2><div class=\"ds\">";
      b.con.forEach(function (c) {
        h += '<div class="dong"><div class="dau"><span class="ten">' + e(c.ten_ngan || c.ten) + "</span>" + (c.la_goi_nay ? '<span class="chip">gói này</span>' : "") + "</div>" +
          thanh(c.da_tt, c.gia_tri) + '<div class="luoi">' + o("Giá trị", tien(c.gia_tri)) + o("Đã trả", tien(c.da_tt)) + o("Còn lại", tien(c.con_lai)) + "</div></div>";
      });
      h += '<div class="dong nhom"><div class="ten">Cộng gói bố</div><div class="luoi">' + o("Giá trị", tien(b.gia_tri)) + o("Đã trả", tien(b.da_tt)) + o("Còn lại", tien(b.con_lai)) + "</div></div></div>";
    }
    var dong = (k.dong || []).filter(function (x) { return x.kl_nay || x.tt_nay; });
    h += "<h2>Công việc thanh toán kỳ này · " + dong.length + " / " + (k.dong || []).length + " dòng</h2>";
    if (!dong.length) return h + '<div class="ds"><div class="trong">Kỳ này không có dòng khối lượng nào.</div></div>';
    h += '<div class="ds">' + dong.map(function (x) {
      return '<div class="dong"><div class="ten">' + e(x.noi_dung) + "</div>" +
        '<div class="luoi">' + o("KL kỳ này", kl(x.kl_nay) + " " + e(x.dv || ""), x.kl_nay < 0 ? "am" : "") + o("KL giá vốn", kl(x.kl_hd)) +
        o("Tiền kỳ này", tien(x.tt_nay), x.tt_nay < 0 ? "am" : "") + "</div></div>";
    }).join("") + "</div>";
    return h + '<p class="chu-thich">Tiền từng dòng là trước thuế. Chỉ liệt kê dòng có khối lượng kỳ này.</p>';
  }

  // ---- phần 1–6: bảng chụp từ máy tính (mobile.json "phan"), bấm dòng để xem chi tiết ----
  var chon = {}, chiTiet = [], loc = "";

  function veBang(b, ma) {
    var cot = b.cot || [], dong = b.dong || [], tag = b.tag || [], khoa = b.khoa || [];
    var dai = cot.map(function (c) { return /nội dung|hạng mục|gói thầu|lý do|nhóm|phạm vi|ghi chú|nguồn|trạng thái/i.test(c[0]); });
    var q = loc.trim().toLowerCase(), hien = 0;
    // Nguoi dung bao 20/10/2026: dong TONG tren dien thoai chi thay con so (14.024.070.043, 12.105.676.973…), khong
    // biet so nao la gi - vi phai vuot ngang, ten cot o tieu de, chu "CONG…" lai o cot thu hai troi mat.
    // -> (1) dong tong dua TEN vao cot dau dung yen; (2) tren bang co khung "Cac so tong": tung so kem ten cot.
    var LA_SO = /^[-−+]?[\d.,]+\s*(%|đ)?$/;
    function tenTong(r) {
      for (var j = 0; j < r.length; j++) { var v = String(r[j] || "").trim(); if (v && !LA_SO.test(v)) return j; }
      return -1;
    }
    var tongs = [];
    // Nguoi dung chot 21/10/2026 (phan Tong hop): da thanh toan = cac dot truoc + dong "Thanh toan dot nay" doi mau,
    // nhap nhay; o bang hang muc / goi to mau va nhap nhay phan dot nay. So lieu: mobile.json dot_nay (tinh tren may tinh).
    var dotNay = b.dot_nay || null, cotDN = b.cot_dot_nay;
    function soCua(v) { var t = String(v || "").replace(/\./g, "").replace(",", ".").replace(/[^\d.\-−]/g, "").replace("−", "-"); return Number(t) || 0; }
    var h = (dotNay && b.dot_nay_ten ? '<div class="bao-dot-nay nhay">● ' + e(b.dot_nay_ten) + ": " +
        tien(dotNay.reduce(function (a, x, i) { return (tag[i] || []).indexOf("tong") >= 0 && x ? x : a; }, 0) ||
             dotNay.filter(Boolean).reduce(function (a, x) { return a + x; }, 0)) + " đ</div>" : "") +
      '<div class="cuon"><table class="bang"><thead><tr>' +
      cot.map(function (c) { return '<th class="' + e(c[1]) + '" scope="col">' + e(c[0]) + "</th>"; }).join("") + "</tr></thead><tbody>";
    dong.forEach(function (r, i) {
      var tg = tag[i] || [], k = khoa[i];
      if (tg.indexOf("tong") >= 0) {
        var jt = tenTong(r);
        var cacSo = [];
        r.forEach(function (v, j) {
          if (j === jt || !String(v || "").trim()) return;
          var dn = dotNay && j === cotDN ? dotNay[i] : null;
          if (dn) {
            cacSo.push(["Đã thanh toán các đợt trước", tien(soCua(v) - dn)]);
            cacSo.push(["Thanh toán đợt này", tien(dn), true]);
          } else cacSo.push([cot[j] ? cot[j][0] : "", v]);
          (b.them_tong || []).forEach(function (t) {
            if (String(r[0] || "").trim() === "TỔNG" && cot[j] && cot[j][0] === t.sau) cacSo.push([t.ten, t.gia_tri]);
          });
        });
        tongs.push({ ten: jt >= 0 ? String(r[jt]) : "Tổng", so: cacSo });
        if (jt > 0 && !String(r[0] || "").trim()) { r = r.slice(); r[0] = r[jt]; r[jt] = ""; }
      }
      if (q && tg.indexOf("tong") < 0 && r.join(" ").toLowerCase().indexOf(q) < 0) return;
      hien++;
      h += '<tr class="' + e(tg.join(" ")) + (k ? " bam" : "") + (dotNay && dotNay[i] ? " hang-dot-nay" : "") + '"' + (k ? ' tabindex="0" data-k="' + e(k) + '"' : "") + ">" +
        r.map(function (v, j) {
          var dn = dotNay && j === cotDN ? dotNay[i] : null;
          return '<td class="' + e((cot[j] || ["", "w"])[1]) + (dai[j] ? " dai" : "") + (dn ? " co-dot-nay" : "") + '">' +
            e(String(v).replace(/ ⏎ /g, "\n")).replace(/\n/g, "<br>") +
            (dn ? '<span class="dot-nay nhay">' + (dn > 0 ? "+" : "") + tien(dn) + " đợt này</span>" : "") + "</td>";
        }).join("") + "</tr>";
    });
    h += "</tbody></table></div>";
    var nhan = dong.length + " dòng" + (q ? " · khớp " + hien : "") + (khoa.some(Boolean) ? " · bấm dòng có dấu › để xem chi tiết" : "") +
      (cot.length > 4 ? " · vuốt ngang để xem hết cột" : "");
    var khungTong = "";
    var coSo = tongs.filter(function (t) { return t.so.length; });
    if (coSo.length) {
      khungTong = '<div class="cac-tong">' + coSo.map(function (t) {
        return '<div class="tong mot-tong"><div class="ten-tong">' + e(t.ten) + "</div>" +
          t.so.map(function (s) { return cap(s[0] || "—", e(s[1]), s[2] ? "dong-dot-nay nhay" : ""); }).join("") + "</div>";
      }).join("") + "</div>";
    }
    return (b.ghi_chu ? '<div class="ghi-chu">' + e(b.ghi_chu) + "</div>" : "") + khungTong +
      '<div class="nho">' + nhan + "</div>" + h;
  }

  function veNhieuBang(ds, ma, tieuDe) {
    if (!ds || !ds.length) return '<div class="ds"><div class="trong">Không có bảng nào.</div></div>';
    var i = Math.min(chon[ma] || 0, ds.length - 1);
    var h = "";
    if (ds.length > 1) {
      h += '<div class="chips" role="group" aria-label="Chọn bảng">' + ds.map(function (b, j) {
        return '<button type="button" data-bang="' + j + '" aria-pressed="' + (j === i) + '">' + e(b.ten) + "</button>";
      }).join("") + "</div>";
    } else if (tieuDe !== false) {
      h += "<h2>" + e(ds[0].ten) + "</h2>";
    }
    var tong = ds[i].dong ? ds[i].dong.length : 0;
    if (tong > 25) h += '<div class="thanh-cong-cu"><input id="o-loc" class="o-loc" type="search" placeholder="Lọc dòng: gõ tên công việc, mã…" value="' + e(loc) + '"></div>';
    return h + veBang(ds[i], ma);
  }

  function trangPhan(ma) {
    var p = (duLieu.phan || []).filter(function (x) { return x.ma === ma; })[0];
    if (!p) {
      if (laViDu) return '<div class="ds"><div class="trong">Ví dụ không có phần này. Mở một file zip hồ sơ để xem số liệu thật.</div></div>';
      return chuaCo(ma + " · bảng đầy đủ");
    }
    return "<h2>" + e(p.ten) + "</h2>" + (p.ghi_chu || []).map(function (c) { return '<div class="ghi-chu">' + e(c) + "</div>"; }).join("") +
      veNhieuBang(p.bang, "p" + ma);
  }

  function trangChiTiet() {
    var k = chiTiet[chiTiet.length - 1], c = (duLieu.chi_tiet || {})[k];
    var h = '<button type="button" class="nut phu quay-lai" id="quay-lai">‹ Quay lại</button>';
    if (!c) return h + '<div class="ds"><div class="trong">Không có chi tiết cho dòng này.</div></div>';
    return h + "<h2>" + e(c.ten) + "</h2>" + (c.ghi_chu ? '<div class="ghi-chu">' + e(c.ghi_chu) + "</div>" : "") +
      veNhieuBang(c.bang, "ct:" + k);
  }

  function ganSuKien() {
    var nd = $("noi-dung");
    Array.prototype.forEach.call(nd.querySelectorAll("[data-bang]"), function (b) {
      b.onclick = function () {
        var ma = chiTiet.length ? "ct:" + chiTiet[chiTiet.length - 1] : "p" + theDang;
        chon[ma] = Number(b.getAttribute("data-bang")); loc = ""; veTrang();
      };
    });
    Array.prototype.forEach.call(nd.querySelectorAll("tr[data-k]"), function (tr) {
      var mo = function () { chiTiet.push(tr.getAttribute("data-k")); loc = ""; veTrang(); window.scrollTo(0, 0); };
      tr.onclick = mo;
      tr.onkeydown = function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); mo(); } };
    });
    var ql = $("quay-lai");
    if (ql) ql.onclick = function () { chiTiet.pop(); loc = ""; veTrang(); };
    var ol = $("o-loc");
    if (ol) ol.oninput = function () {
      loc = ol.value; var pos = ol.selectionStart; veTrang();
      var o2 = $("o-loc"); if (o2) { o2.focus(); try { o2.setSelectionRange(pos, pos); } catch (x) {} }
    };
  }

  function trangNhatKy() {
    var a = duLieu.nhat_ky_thanh_toan, g = duLieu.nhat_ky_gia_von, h = "";
    if (!a && !g) return chuaCo("Nhật ký");
    if (a) {
      h += "<h2>Thanh toán nhà thầu · " + a.ds.length + " lần</h2>";
      h += '<div class="ds">' + (a.ds.length ? a.ds.slice().reverse().map(function (x) {
        return '<div class="dong"><div class="dau"><span class="ten">' + e(x.goi) + " · đợt " + String(x.dot).padStart(2, "0") + '</span><span class="so' + (x.tien < 0 ? " am" : "") + '">' + tien(x.tien) + "</span></div>" +
          '<div class="nho">' + e(x.loai) + " · " + e(x.luc) + (x.ghi_chu ? " · " + e(x.ghi_chu) : "") + "</div></div>";
      }).join("") : '<div class="trong">Chưa có lần thanh toán nào.</div>') +
        '<div class="dong nhom">' + cap("Tổng đã thanh toán (trừ các lần hủy)", tien(a.tong), "dam") + "</div></div>";
    }
    if (g) {
      h += "<h2>Giá vốn thay đổi · " + g.ds.length + " lần</h2><div class=\"ds\">" +
        '<div class="dong nhom">' + cap("Giá vốn lần đầu", tien(g.dau)) + cap("Giá vốn cuối cùng", tien(g.cuoi), "dam") +
        cap("Chênh", tien(g.dau != null && g.cuoi != null ? g.cuoi - g.dau : null)) + "</div>" +
        g.ds.slice().reverse().map(function (x) {
          return '<div class="dong"><div class="dau"><span class="ten">' + e(x.nguon) + (x.pham_vi ? " · " + e(x.pham_vi) : "") + '</span><span class="so' + (x.chenh < 0 ? " am" : "") + '">' +
            (x.chenh != null ? (x.chenh > 0 ? "+" : "") + tien(x.chenh) : tien(x.sau)) + "</span></div>" +
            '<div class="nho">' + e(x.thoi_diem) + (x.ly_do ? " · " + e(x.ly_do) : "") + "</div></div>";
        }).join("") + "</div>";
    }
    return h;
  }

  function veTrang() {
    var nd = $("noi-dung"), hep = theDang === "ky" || theDang === "nk";
    if (chiTiet.length) { nd.innerHTML = trangChiTiet(); hep = false; }
    else if (theDang === "ky") nd.innerHTML = trangKyNay();
    else if (theDang === "nk") nd.innerHTML = trangNhatKy();
    else nd.innerHTML = trangPhan(theDang);
    nd.classList.toggle("tom", hep);
    ganSuKien();
  }

  function hien(d, viDu) {
    duLieu = d; laViDu = !!viDu; chiTiet = []; chon = {}; loc = "";
    if (!CAC_THE.some(function (t) { return t[0] === theDang; })) theDang = "ky";
    bao(d.loi ? "Máy tính gặp lỗi khi lập các bảng tổng hợp cho hồ sơ này (" + e(d.loi) + "). Chỉ xem được phần kỳ này và nhật ký." : "");
    veHoSo(); veThe(); veTrang();
  }

  // Hồ sơ cũ chỉ có thong_tin.json: dựng phần "kỳ này" như thanh_toan.dong_ky_nay
  function tuThongTin(tt) {
    return { phien_ban: 0, cong_trinh: tt.cong_trinh, ky_nay: {
      goi: tt.goi, dot: tt.dot, ngay: tt.ngay, tao_luc: tt.tao_luc, da_ghi_nhan: tt.da_ghi_nhan !== false,
      lan_nay: tt.lan_nay, tong_luy_ke: tt.tong_luy_ke, tong_luy_ke_sau_thue: tt.tong_luy_ke_sau_thue, thue_suat: tt.thue_suat,
      tam_ung: tt.tam_ung || 0, da_thanh_toan: tt.da_thanh_toan || 0, chua_thanh_toan: tt.chua_thanh_toan,
      gia_tri_hop_dong: tt.gia_tri_hop_dong, cac_ky_da_tra: tt.cac_ky_da_tra || [], goi_bo: tt.goi_bo || null,
      dong: (tt.dong || []).map(function (x) {
        var dg = [x.dg_vl || 0, x.dg_nc || 0, x.dg_may || 0], lk = x.kl_luy_ke || 0, tr = x.kl_truoc || 0;
        var ttHd = x.thanh_tien_hd != null ? x.thanh_tien_hd : tienBaPhan(x.kl_hd || 0, dg[0], dg[1], dg[2]);
        var ttLk = tienBaPhan(lk, dg[0], dg[1], dg[2]);
        return { noi_dung: x.noi_dung, dv: x.dv, kl_hd: x.kl_hd, kl_nay: lk - tr, tt_hd: ttHd,
          tt_nay: ttLk - tienBaPhan(tr, dg[0], dg[1], dg[2]), con_lai: ttHd - ttLk };
      }) } };
  }

  // Android: doc HET file vao bo nho TRUOC (file lay tu Zalo / Tep la content://, xoa o chon file som thi co may
  // khong doc duoc nua) - nguoi dung bao 21/10/2026 "ios ok nhung android co van de khi chon file zip"
  function docBoNho(file) {
    if (file.arrayBuffer) return file.arrayBuffer();
    return new Promise(function (ok, hong) {
      var r = new FileReader();
      r.onload = function () { ok(r.result); };
      r.onerror = function () { hong(r.error || new Error("khong-doc-duoc")); };
      r.readAsArrayBuffer(file);
    });
  }

  function docFile(file, xong) {
    if (!file) { if (xong) xong(); return; }
    if (typeof JSZip === "undefined") { bao("Không tải được bộ đọc file zip. Kiểm tra mạng rồi mở lại trang."); if (xong) xong(); return; }
    bao("Đang đọc " + e(file.name || "file") + "…", "vang");
    docBoNho(file).then(function (buf) {
      if (xong) xong();
      return JSZip.loadAsync(buf);
    }).then(function (z) {
      var m = z.file("mobile.json"), t = z.file("thong_tin.json");
      if (m) return m.async("string").then(function (s) { return JSON.parse(s); });
      if (t) return t.async("string").then(function (s) { return tuThongTin(JSON.parse(s)); });
      throw new Error("khong-phai-ho-so");
    }).then(function (d) {
      theDang = "ky";
      hien(d, false);
      if (!d.phan) bao("Hồ sơ lập bằng bản chương trình cũ: chưa có đủ các phần 1–6. Các đợt thanh toán bằng chương trình bản mới sẽ có file zip xem được đầy đủ.", "vang");
    }).catch(function (err) {
      if (xong) xong();
      var ten = e(file.name || "đã chọn");
      bao(err && err.message === "khong-phai-ho-so"
        ? "File “" + ten + "” không phải hồ sơ thanh toán của chương trình (không có thong_tin.json). Chọn file zip trong thư mục XIN THANH TOAN."
        : "Không đọc được file “" + ten + "” như một file zip. Hãy chọn đúng file .zip thanh toán; nếu file tải từ Zalo / email bị lỗi thì tải lại rồi mở lại.");
    });
  }

  $("o-file").addEventListener("change", function (ev) {
    var o = ev.target;
    docFile(o.files && o.files[0], function () { try { o.value = ""; } catch (x) {} });
  });

  // Người dùng báo 19/10/2026: mở link thấy SỐ LIỆU CŨ (hồ sơ nhớ từ lần trước / bảng ví dụ) -> mở trang
  // là trang TRỐNG, chỉ hiện số liệu của file zip vừa chọn; không nhớ hồ sơ trên máy nữa.
  function veTrong() {
    duLieu = null; chiTiet = [];
    bao("");
    $("ho-so").innerHTML =
      '<div class="ten-ct">Chưa mở hồ sơ nào</div>' +
      '<div class="nho">Bấm <b>📂 Mở file zip</b> rồi chọn file zip thanh toán (chương trình trên máy tính tự tạo khi bấm “Thanh toán đợt này”, nằm trong thư mục XIN THANH TOAN; nhận qua Zalo / email). ' +
      'Trên điện thoại / iPad: lưu file vào Tệp (Files) trước.</div>' +
      '<div class="nho">Trang chỉ hiện số liệu của file vừa chọn — đóng trang là hết, không lưu lại trên máy.</div>' +
      '<div class="nho">Trang chỉ để XEM — không thêm, xóa, sửa, lưu hay xuất được gì.</div>';
    $("cac-the").innerHTML = "";
    $("noi-dung").innerHTML = "";
  }

  function batDau() {
    // xoa ho so da nho cua ban truoc (de khong bao gio hien so lieu cu)
    try { localStorage.removeItem(KHOA_NHO); localStorage.removeItem("so-tt-the"); } catch (x) {}
    veTrong();
  }
  batDau();
})();
</script>
